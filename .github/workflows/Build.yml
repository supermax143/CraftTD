name: Build project

on:
  workflow_dispatch:
    inputs:
      targetPlatform:
        description: 'Platform to build'
        required: true
        type: choice
        options:
         # - StandaloneOSX
         # - StandaloneWindows
         # - StandaloneWindows64
         # - StandaloneLinux64
         # - iOS
          - WebGL
          - Android

jobs:
  build:
    name: Build for ${{ inputs.targetPlatform }}
    runs-on: ubuntu-latest
    env:
      HOME: /github/home

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ inputs.targetPlatform }}
          restore-keys: Library-

      # Проверяем свободное место ДО очистки
      - name: Check disk space before cleanup
        run: df -h

      # Освобождаем место на runner
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1

      # Проверяем свободное место ПОСЛЕ очистки
      - name: Check disk space after cleanup
        run: df -h

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2 libgl1-mesa-dri xvfb libxrandr2 libxss1 libxcursor1 libasound2

      - name: Prepare Unity cache directories
        run: |
          mkdir -p "$HOME/.cache/unity3d" "$HOME/.local/share/unity3d"
          chmod -R u+rwX "$HOME/.cache/unity3d" "$HOME/.local/share/unity3d"
          ls -la "$HOME"

      - name: Activate Unity license
        uses: game-ci/unity-actions@v2
        with:
          action: activate
          license: ${{ secrets.UNITY_LICENSE }}

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ inputs.targetPlatform }}

      - uses: actions/upload-artifact@v4
        with:
          name: Build-${{ inputs.targetPlatform }}
          path: build/${{ inputs.targetPlatform }}
