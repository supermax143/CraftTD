<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>{{{ PRODUCT_NAME }}}</title>
  <link rel="stylesheet" href="TemplateData/style.css">

  <script>
    const overlayBackgroundColor = "{{{ OVERLAY_BACKGROUND_COLOR.replace(/ /g, '') }}}";
    const progressBarFillColor = "{{{ PROGRESS_BAR_FILL_COLOR.replace(/ /g, '') }}}";
    const progressBarBackgroundColor = "{{{ PROGRESS_BAR_BACKGROUND_COLOR.replace(/ /g, '') }}}";
    const progressBarBorderColor = "{{{ PROGRESS_BAR_BORDER_COLOR.replace(/ /g, '') }}}";
    const backgroundFileName = "{{{ BACKGROUND_IMAGE_FILE.replace(/ /g, '') }}}";
  </script>

<style>
  /* Убираем выделение по нажатию клавиш */
  canvas:focus {
      outline: none;
  }

  html, body {
      /* Убираем отступы */
      padding: 0;
      margin: 0;
      /* Отключаем скролл и лонгтап на IOS */
      overflow: hidden;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -khtml-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: rgba(0,0,0,0);
      /* Ставим высоту на 100% */
      height: 100%;
  }
</style>

</head>

<body class="{{{ SPLASH_SCREEN_STYLE.toLowerCase() }}}">

  <script>
    // 1. ПЕРЕОПРЕДЕЛЯЕМ window.alert, чтобы блокировать попапы от Unity
    var originalAlert = window.alert;
    window.alert = function(message) {
      var msg = message ? message.toString() : '';
  
      // Список фраз, которые мы хотим скрыть (платежи и Pointer Lock)
      var blockedPhrases = [
        'purchase_not_found',
        'payment_rejected',
        'REJECTED',
        'USER_CANCEL',
        'canceled',
        'cancelled',
        'Pointer lock cannot be acquired',
        'exited the lock',
        'SecurityError'
      ];
  
      // Проверяем, содержит ли сообщение одну из запрещенных фраз
      var isBlocked = blockedPhrases.some(function(phrase) {
        return msg.includes(phrase);
      });
  
      if (isBlocked) {
        console.log('[Game] Alert suppressed:', msg);
        return; // Не показываем alert
      }
  
      // Все остальные alert показываем как обычно
      originalAlert.call(window, message);
    };
  
    // 2. Перехватываем необработанные Promise rejection
    window.addEventListener('unhandledrejection', function(event) {
      var reason = event.reason;
      var errorMessage = '';
  
      if (typeof reason === 'string') {
        errorMessage = reason;
      } else if (reason && reason.message) {
        errorMessage = reason.message;
      } else if (reason && reason.toString) {
        errorMessage = reason.toString();
      }
  
      var blockedPhrases = [
        'payment_rejected', 'REJECTED', 'USER_CANCEL', 'canceled', 'cancelled',
        'Pointer lock cannot be acquired', 'exited the lock'
      ];
  
      var isBlocked = blockedPhrases.some(function(phrase) {
        return errorMessage.includes(phrase);
      });
  
      if (isBlocked) {
        console.log('[Game] Promise rejection suppressed:', errorMessage);
        event.preventDefault();
        event.stopPropagation();
        return false;
      }
    });
  
    // 3. Перехватываем обычные ошибки JavaScript
    window.onerror = function(msg, url, line, col, error) {
      var errorMessage = msg ? msg.toString() : '';
  
      var blockedPhrases = [
        'payment_rejected', 'REJECTED', 'USER_CANCEL',
        'Pointer lock cannot be acquired', 'exited the lock'
      ];
  
      var isBlocked = blockedPhrases.some(function(phrase) {
        return errorMessage.includes(phrase);
      });
  
      if (isBlocked) {
        console.log('[Game] JS error suppressed:', errorMessage);
        return true; // Предотвращаем показ alert
      }
  
      return false;
    };
  </script> 


  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas"></canvas>
  </div>
  <div id="loading-cover" style="display:none;">
    <div id="unity-loading-bar">
      <div id="unity-logo"><img src="logo1.png"></div>
      <div id="unity-progress-bar-empty" style="display: none;">
        <div id="unity-progress-bar-full"></div>
      </div>
      <div class="spinner"></div>
    </div>
  </div>

  <script>
    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
    const config = {
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      workerUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
      // #if MEMORY_FILENAME
      //   memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
      // #endif
      // #if SYMBOLS_FILENAME
      //   symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
      // #endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: "{{{ COMPANY_NAME }}}",
      productName: "{{{ PRODUCT_NAME }}}",
      productVersion: "{{{ PRODUCT_VERSION }}}",
    };

    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingCover = document.querySelector("#loading-cover");
    const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const spinner = document.querySelector('.spinner');

    if (overlayBackgroundColor !== " " && overlayBackgroundColor !== ""){
      canvas.style.background = overlayBackgroundColor;
    }

    if (progressBarFillColor !== " " && progressBarFillColor !== ""){
      progressBarFull.style.background = progressBarFillColor;
    }

    if (progressBarBackgroundColor !== " " && progressBarBackgroundColor !== ""){
      progressBarEmpty.style.background = progressBarBackgroundColor;
    }

    if (progressBarBorderColor !== " " && progressBarBorderColor !== ""){
      progressBarEmpty.style.border.color = progressBarBorderColor;
    }

    if (backgroundFileName !== " " && backgroundFileName !== ""){
      canvas.style.background = "url('" + backgroundFileName + "') center / cover";
    }

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      container.className = "unity-mobile";
    }

    // #if BACKGROUND_FILENAME
    // canvas.style.background = "url('" + buildUrl + "/{{{ BACKGROUND_FILENAME.replace(/'/g, '%27') }}}') center / cover";
    // #endif

    loadingCover.style.display = "";

        // Выключаем появление меню при правом клике мыши
        document.addEventListener('contextmenu', event => event.preventDefault());

        // Возвращаем фокус, если кликнули по экрану
        function FocusGame() {
            window.focus();
            canvas.focus();
        }

        window.addEventListener('pointerdown', () => {
            FocusGame();
        });
        window.addEventListener('touchstart', () => {
            FocusGame();
        });

    const unityLoader = document.createElement("script");
    unityLoader.src = loaderUrl;
    unityLoader.onload = async () => {
      createUnityInstance(canvas, config, (progress) => {
        spinner.style.display = "none";
        progressBarEmpty.style.display = "";
        progressBarFull.style.width = `${100 * progress}%`;
		autoSyncPersistentDataPath = true;
      }).then((unityInstance) => {
        window.unityInstance = unityInstance;
        loadingCover.style.display = "none";
      }).catch((message) => {
        alert(message);
      });
    };
    document.body.appendChild(unityLoader);

    document.addEventListener("pointerdown", () => {
      container.focus();
      window.focus();
      canvas.focus();
    });

  </script>
</body>

</html>
